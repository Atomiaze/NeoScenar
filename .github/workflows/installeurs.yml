# Sur une étiquette v* (par exemple v0.1.0) : construit les installeurs des trois systèmes et
# prépare un brouillon de « Release » GitHub. David relit le brouillon et le publie lui-même.
name: Installeurs

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    name: Installeurs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            systeme: --mac
          - os: windows-latest
            systeme: --win
          - os: ubuntu-latest
            systeme: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # L'étiquette doit correspondre à la version de package.json (v0.1.0 ↔ 0.1.0).
      - name: Vérifier la version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Étiquette $GITHUB_REF_NAME, mais package.json indique $VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Aucune signature (choix assumé) ; rien n'est publié par electron-builder lui-même.
      - run: npx electron-builder ${{ matrix.systeme }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  brouillon:
    name: Brouillon de Release
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installeurs
          merge-multiple: true
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          **Version d'essai (pre-release).** Choisissez le fichier de votre système :

          - **Mac** (Intel et Apple Silicon) : `NeoScenar-…-mac.dmg`
          - **Windows** : `NeoScenar-…-windows-installation.exe` (installé dans votre compte, sans droit administrateur) ou `NeoScenar-…-windows-portable.exe` (rien à installer)
          - **Ubuntu / Linux** : `NeoScenar-…-linux.deb` (conseillé) ou `NeoScenar-…-linux.AppImage`

          L'application n'est pas signée : un avertissement apparaît au premier lancement (voir le guide d'installation).
          NOTES
          gh release create "$TAG" installeurs/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "NeoScenar $TAG" \
            --notes-file notes.md
